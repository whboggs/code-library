<script>
  // ES5 — runs inside GTM Custom HTML tag wrapper
  // Pass the Lead event payload from GTM variables into the global namespace
  // The hosted script reads this object and calls fbq('track', 'Lead', ...)
  window.mtMetaPixelLead = {
    lead_type: 'Form Submit', // Define Lead Type
    traffic_source: '{{cJS - Traffic Source}}', // Finds Last Touch traffic source
    // form_name: '{{LUT - Convert Form ID to Text}}', // (Optional) Translate form ID to Form Name via LUT Variable
    content_name: '{{Page Path}}'
  };

  // Load the hosted Lead event script from CDN
  // Pointed at @main for testing — switch to @v1 once a v1.x.x tag is published
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/gh/whboggs/marketing-toolkit@main/meta/pixel/lead/lead-config.js';
  s.async = true;
  document.head.appendChild(s);
</script>
